# Mise en ligne de l'appli sur GitHub Pages à chaque envoi sur la branche main.
# Réglages à faire une fois sur GitHub :
#   1. Settings → Pages → Source : « GitHub Actions »
#   2. Settings → Secrets and variables → Actions → Variables : VITE_API_URL = adresse du serveur
#      et VITE_CONTACT_EMAIL = email de contact affiché dans les mentions légales
name: Mise en ligne de l'appli
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
