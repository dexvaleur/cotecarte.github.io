# Configuration Render (hébergeur du serveur). Render la lit automatiquement
# si tu crées le service avec « New → Blueprint ».
services:
  - type: web
    name: pokecard-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://dexvaleur.github.io,https://cotecarte.github.io,https://ilyas-celldtyjdy.github.io
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Envoi des emails par l'API Brevo (Render gratuit bloque le SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Accès privé : emails autorisés, séparés par des virgules (vide = ouvert à tous)
      - key: ALLOWED_EMAILS
        sync: false
      # Emails autorisés à voir les statistiques (Réglages → Statistiques)
      - key: ADMIN_EMAILS
        sync: false
